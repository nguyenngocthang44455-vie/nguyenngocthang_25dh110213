<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký sinh viên - Nâng cao</title>
</head>
<body>

    <h2>NHẬP THÔNG TIN SINH VIÊN</h2>

    <form action="https://www.google.com" method="post" enctype="multipart/form-data">
        <table border="1" cellpadding="5" cellspacing="0" width="100%">
            <tr>
                <td rowspan="3" align="center" valign="middle">
                    <img src="img/hinh01.jpg" alt="Hình đại diện" width="150">
                </td>
                <td>HỌ VÀ TÊN:</td>
                <td colspan="2">
                    <input type="text" id="hoten" name="hoten" required style="width: 90%;">
                </td>
            </tr>

            <tr>
                <td>MÃ SỐ SINH VIÊN :</td>
                <td colspan="2">
                    <input type="text" id="mssv" name="mssv" pattern="[0-9]{2}[a-z]{2}[0-9]{6}" title="Nhập đúng định dạng, ví dụ: 17dh110123" required style="width: 90%;">
                </td>
            </tr>

            <tr>
                <td>NGÀY SINH:</td>
                <td colspan="2">
                    <input type="date" id="ngaysinh" name="ngaysinh" required>
                </td>
            </tr>

            <tr>
                <td colspan="2">CHUYÊN NGÀNH:</td>
                <td colspan="2">
                    <input type="radio" id="cnpm" name="chuyennganh" value="CNPM" required>
                    <label for="cnpm">CNPM</label>
                    <input type="radio" id="httt" name="chuyennganh" value="HTTT">
                    <label for="httt">HTTT</label>
                    <input type="radio" id="anm" name="chuyennganh" value="AN NINH MẠNG">
                    <label for="anm">AN NINH MẠNG</label>
                </td>
            </tr>

            <tr>
                <td colspan="2">SỞ THÍCH:</td>
                <td colspan="2">
                    <input type="checkbox" id="laptrinh" name="sothich" value="Viết chương trình">
                    <label for="laptrinh">VIẾT CHƯƠNG TRÌNH</label><br>
                    <input type="checkbox" id="csdl" name="sothich" value="Phân tích CSDL">
                    <label for="csdl">PHÂN TÍCH CSDL</label><br>
                    <input type="checkbox" id="mang" name="sothich" value="Xây dựng sơ đồ mạng">
                    <label for="mang">XÂY DỰNG SƠ ĐỒ MẠNG</label>
                </td>
            </tr>

            <tr>
                <td>MÀU SẮC YÊU THÍCH:</td>
                <td>
                    <input type="color" id="mau" name="mau" value="#000000">
                </td>
                <td>HÌNH ĐẠI DIỆN:</td>
                <td>
                    <input type="file" id="hinhanh" name="hinhanh" accept=".jpg,.jpeg,.png" required>
                </td>
            </tr>

            <tr>
                <td>TÊN ĐĂNG NHẬP WEB TRƯỜNG:</td>
                <td>
                    <input type="text" id="tendn" name="tendn" required>
                </td>
                <td>MẬT KHẨU ĐĂNG NHẬP WEB TRƯỜNG:</td>
                <td>
                    <input type="password" id="matkhau" name="matkhau" minlength="6" required>
                </td>
            </tr>

            <tr>
                <td colspan="4" align="center">
                    <input type="submit" value="Gửi dữ liệu về máy chủ">
                </td>
            </tr>
        </table>
    </form>

    <p><a href="home.html">Quay về trang chủ</a></p>

</body>
</html>
