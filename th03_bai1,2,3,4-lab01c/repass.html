<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lấy lại mật khẩu</title>
</head>
<body>

    <form action="https://www.google.com" method="post">
        <fieldset>
            <legend>Lấy lại mật khẩu:</legend>

            <p>
                <label for="mssv">Mã số sinh viên:</label><br>
                <input type="text" id="mssv" name="mssv">
            </p>

            <p>
                <label for="matkhaucu">Mật khẩu cũ:</label><br>
                <input type="password" id="matkhaucu" name="matkhaucu">
            </p>

            <p>
                <label for="matkhaumoi">Mật khẩu mới:</label><br>
                <input type="password" id="matkhaumoi" name="matkhaumoi">
            </p>

            <p>
                <label for="nhaplai">Nhập lại Mật khẩu mới:</label><br>
                <input type="password" id="nhaplai" name="nhaplai">
            </p>

            <p>
                <input type="submit" value="Lưu lại">
            </p>
        </fieldset>
    </form>

    <p><a href="home.html">Quay về trang chủ</a></p>

</body>
</html>
